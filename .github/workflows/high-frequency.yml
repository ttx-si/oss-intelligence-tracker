name: High-frequency intelligence

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: db-pipeline
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "The shared Release can only be published from the default branch." >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebase before ingestion
        run: git pull --rebase origin "$GITHUB_REF_NAME"
      - name: Install project
        run: python -m pip install .
      - name: Ingest and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          APPRISE_URLS: ${{ secrets.APPRISE_URLS }}
          TRENDSHIFT_API_KEY: ${{ secrets.TRENDSHIFT_API_KEY }}
        run: sh .github/scripts/run-intelligence.sh
      - name: Preserve a failed run for recovery
        if: failure() && hashFiles('intelligence-base-revision.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            intelligence.db
            data/schema_data.sql
            intelligence-base-revision.txt
          retention-days: 7
          if-no-files-found: ignore
