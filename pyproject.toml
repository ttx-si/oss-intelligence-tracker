[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-intelligence-tracker"
version = "0.1.0"
description = "Serverless Open Source Intelligence Tracker"
readme = "GLOSSARY.md"
requires-python = ">=3.11"
dependencies = ["apprise>=1.7", "gtrending>=0.5.1"]

[project.scripts]
oss-intelligence = "oss_intelligence.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
